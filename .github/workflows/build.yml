name: Build Voxy Snow & Shallow Water Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Unpack the Gradle project before setting up Gradle. The project is
      # uploaded as a ZIP, rather than stored as Gradle files in the repo.
      - name: Extract source project
        run: |
          test -f voxy-snow-fluid-fix-source.zip
          mkdir source
          unzip -q voxy-snow-fluid-fix-source.zip -d source

      # Minecraft 26.3 uses Loom's non-obfuscated setup, where Fabric Loader
      # should be on implementation, not the older modImplementation configuration.
      - name: Adjust Fabric Loader dependency for Minecraft 26.3
        run: |
          sed -i 's/modImplementation "net.fabricmc:fabric-loader:/implementation "net.fabricmc:fabric-loader:/' source/voxy-snow-fluid-fix/build.gradle
          grep -n 'net.fabricmc:fabric-loader' source/voxy-snow-fluid-fix/build.gradle

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          # Avoid cache fingerprinting for a project unpacked from a ZIP.
          cache-disabled: true

      - name: Build mod JAR
        run: gradle -p source/voxy-snow-fluid-fix build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: voxy-snow-fluid-fix-jar
          path: source/voxy-snow-fluid-fix/build/libs/voxy-snow-fluid-fix-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
